<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Tiny Shop" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <a href="/products" class="brand-link">Tiny Shop</a>
      <span class="tag">SDET Exercise</span>
    </div>
    <nav class="nav">
      <a href="/products">Products</a>
      <a href="/cart" id="nav-cart">Cart</a>
    </nav>
  </header>

  <main class="container">
    {% if errors %}
      <div class="alert" role="alert">
        <strong>There were problems:</strong>
        <ul>
          {% for e in errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Local demo app • UI + API</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
